name: Deploy

# Every push to `prod` (normally a merge from main) builds the site and publishes it to
# Cloudflare Pages.

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'breadboard-simulator-website' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Create the Pages project if it does not exist
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=prod || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '635855454df6c49569f6abdec95a0ad7' }}

      - name: Deploy to Cloudflare Pages
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name="$PAGES_PROJECT" --branch=prod
          --commit-hash="$GITHUB_SHA" --commit-message="$(git log -1 --format=%s | head -c 300)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '635855454df6c49569f6abdec95a0ad7' }}
